
name: Build Countdown Widget APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Show repository files
        run: |
          find . -maxdepth 5 -type f | sort | head -200

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Find project and build APK
        run: |
          SETTINGS_FILE=$(find . -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) -not -path "*/.gradle/*" -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: Gradle project not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "Project found: $PROJECT_DIR"

          cd "$PROJECT_DIR"
          gradle assembleDebug --stacktrace

          APK_PATH=$(find . -type f -path "*/build/outputs/apk/debug/*.apk" -print -quit)

          if [ -z "$APK_PATH" ]; then
            echo "Debug APK not found. Searching all APK files:"
            find . -type f -name "*.apk"
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          cp "$APK_PATH" "$GITHUB_WORKSPACE/artifacts/CountdownWidget.apk"

          echo "APK successfully located and copied!"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Countdown-Widget-APK
          path: artifacts/CountdownWidget.apk
          if-no-files-found: error
